    gi:gi,colorPhotos:colorPhotos,mainImg:mainImg};
}
function detailConfigLines(ctx){

      '<div><div style="position:relative;background:#f5f5f7;border-radius:28px;display:flex;align-items:center;justify-content:center;padding:clamp(20px,3vw,36px);min-height:clamp(420px,46vw,560px)"><div role="img" aria-label="'+curP.name+'" style="width:100%;height:clamp(380px,42vw,520px);border-radius:16px;background-image:url(\''+mainImg+'\');background-size:contain;background-position:center;background-repeat:no-repeat"></div>'+navHtml+'</div>'+dotsHtml+'</div>'+
      '<div>'+modelHtml+
        (hasCaseColors?('<h2 style="font-size:20px;font-weight:600;margin:0 0 10px">Cor da caixa.</h2><div style="display:flex;gap:12px;margin-bottom:28px">'+caseColorsHtml+'</div>'):'')+
        (hasColors?('<h2 style="font-size:20px;font-weight:600;margin:0 0 10px">'+(curP.colorLabel||'Cor')+'. <span style="color:var(--text-3);font-weight:500">Escolha sua favorita.</span></h2><p style="font-size:14px;font-weight:600;margin:0 0 12px">'+(curP.colorLabel||'Cor')+' - '+selectedColorName+'</p><div style="display:flex;gap:12px;margin-bottom:28px">'+colorsHtml+'</div>'):'')+
        memoryHtml+
        storageHtml+
        '<div style="display:flex;flex-direction:column;gap:12px"><button data-act="addToCart" style="display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#0a90dd;color:#fff;font-size:17px;font-weight:600;padding:16px 24px;border-radius:980px;border:none;cursor:pointer;box-shadow:0 10px 26px rgba(10,144,221,.34);min-height:52px">'+CART_ICON+' Adicionar ao carrinho</button><a href="'+waAsk+'" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--surface-2);color:var(--text);font-size:16px;font-weight:500;padding:15px 24px;border-radius:980px;border:1px solid var(--border);min-height:50px">Consultar disponibilidade no WhatsApp</a></div>'+
        '<p style="font-size:13px;color:var(--text-3);margin:16px 0 0">🇧🇷 Envio para todo o Brasil · Compra segura</p>'+
      '</div>'+
    '</div>'+
    '<section style="margin:clamp(52px,7vw,90px) 0 0"><h2 style="font-size:clamp(26px,3vw,38px);font-weight:600;letter-spacing:-.025em;margin:0 0 clamp(22px,3vw,34px);text-align:center">Por que você vai amar</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">'+featuresHtml+'</div></section>'+
        highlightsHtml+
        '<section style="margin:clamp(48px,6vw,80px) auto 0;max-width:760px"><h2 style="font-size:clamp(22px,2.6vw,30px);font-weight:600;margin:0 0 20px;text-align:center">Especificações</h2><div style="border-top:1px solid var(--border)">'+specsHtml+'</div></section>'+
    '<section style="margin:clamp(52px,7vw,90px) 0 0"><h2 style="font-size:clamp(24px,2.8vw,34px);font-weight:600;letter-spacing:-.025em;margin:0 0 24px">Você também pode gostar</h2><div style="position:relative">'+
      '<button data-act="scrollRow" data-val="row-related:-1" aria-label="Anterior" class="arrow-btn" style="position:absolute;left:-8px;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>'+
      '<button data-act="scrollRow" data-val="row-related:1" aria-label="Próximo" class="arrow-btn" style="position:absolute;right:-8px;top:50%;transform:translateY(-50%);z-index:5;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>'+
      '<div id="row-related" class="noscroll" style="display:flex;gap:16px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory">'+relatedHtml+'</div></div></section>'+
    '<div class="buybar" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:75;align-items:center;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--menu-bg);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);border-top:1px solid var(--border);box-shadow:0 -6px 20px rgba(0,0,0,.08)"><div style="flex:1;min-width:0"><div style="font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+curP.name+'</div></div><button data-act="addToCart" style="flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:#0a90dd;color:#fff;font-size:16px;font-weight:600;padding:14px 24px;border-radius:980px;min-height:50px;border:none;cursor:pointer;box-shadow:0 8px 20px rgba(10,144,221,.34)">'+CART_ICON+' Adicionar</button></div>'+
  '</main>';
}

function renderFooter(waGeneral,instaUrl){
  return '<footer style="background:var(--surface-alt);margin-top:clamp(56px,8vw,100px);border-top:1px solid var(--border)"><div style="max-width:1180px;margin:0 auto;padding:clamp(44px,6vw,72px) 22px;text-align:center">'+
    '<img src="'+logoSrc()+'" alt="LOA* Select" style="height:76px;width:auto;margin:0 auto 6px;display:block" />'+
    '<p style="font-size:14px;color:var(--text-3);margin:0 0 26px">Curadoria de produtos Apple · 🇧🇷 Envio para todo o Brasil</p>'+
    '<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center"><a href="'+waGeneral+'" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:9px;background:#0a90dd;color:#fff;font-size:15px;font-weight:600;padding:13px 24px;border-radius:980px;box-shadow:0 8px 22px rgba(10,144,221,.3)">'+WA_ICON+' WhatsApp</a><a href="'+instaUrl+'" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;gap:9px;background:var(--surface-2);color:var(--text);font-size:15px;font-weight:500;padding:13px 22px;border-radius:980px;border:1px solid var(--border)"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.3" cy="6.7" r="1" fill="currentColor" stroke="none"></circle></svg> @loa.select</a></div>'+
    '<p style="font-size:11px;line-height:1.7;color:var(--text-3);max-width:560px;margin:34px auto 0">LOA<span style="color:#0a90dd">*</span> Select é uma revendedora independente. Apple, iPhone, MacBook, iPad, AirPods e Apple Watch são marcas registradas da Apple Inc.</p>'+
    '<p style="font-size:11px;color:var(--text-3);margin:14px 0 0">Desenvolvido por <a href="https://linkefydigital.com.br/" target="_blank" rel="noopener noreferrer" style="font-weight:700;color:var(--text-3)">Linkefy</a></p>'+
  '</div></footer>';
}

function renderFloat(waGeneral){
  return '<a href="'+waGeneral+'" target="_blank" rel="noopener noreferrer" aria-label="Fale conosco no WhatsApp" class="wa-float" style="position:fixed;right:22px;bottom:22px;z-index:80;width:60px;height:60px;border-radius:50%;background:#0a90dd;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(10,144,221,.42);animation:waBob 2.4s ease-in-out infinite,waPulse 2.4s ease-out infinite"><svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91C21.95 6.45 17.5 2 12.04 2zm5.8 14.03c-.24.68-1.42 1.32-1.95 1.36-.53.04-1.02.24-3.45-.72-2.92-1.15-4.76-4.15-4.9-4.34-.14-.19-1.17-1.55-1.17-2.96s.74-2.1 1-2.39c.26-.29.57-.36.76-.36.19 0 .38 0 .55.01.18.01.42-.07.65.5.24.58.82 2 .89 2.15.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.38-.42.51-.14.14-.28.29-.12.57.16.29.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.69-.8.87-1.08.18-.28.36-.23.61-.14.25.09 1.58.75 1.85.89.27.14.45.21.52.33.07.12.07.69-.17 1.37z"></path></svg></a>';
}

function renderCartDrawer(waNumber){
  if(!state.cartOpen)return '';
  var items=cart.length?cart.map(function(it){
    var cfg=it.config.map(function(c){return '<div style="font-size:12px;color:var(--text-3)">'+c[0]+': '+c[1]+'</div>';}).join('');
    return '<div style="display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border)"><div style="width:64px;height:64px;flex:0 0 auto;border-radius:12px;background:#f5f5f7;background-image:url(\''+it.img+'\');background-size:contain;background-position:center;background-repeat:no-repeat"></div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+it.name+'</div>'+cfg+'</div><button data-act="removeCartItem" data-val="'+it.id+'" aria-label="Remover" style="border:none;background:none;color:var(--text-3);cursor:pointer;padding:4px;align-self:flex-start"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>';
  }).join(''):'<p style="font-size:14px;color:var(--text-3);text-align:center;padding:40px 0">Seu carrinho está vazio.</p>';
  var checkoutLink=waLink(waNumber,cartMessage());
  return '<div data-act="toggleCart" style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90"></div>'+
    '<div style="position:fixed;top:0;right:0;bottom:0;width:min(94vw,420px);background:var(--surface);z-index:91;box-shadow:-12px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column;padding:20px">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px"><h2 style="font-size:19px;font-weight:600;margin:0">Carrinho</h2><button data-act="toggleCart" aria-label="Fechar" style="border:none;background:none;color:var(--text);cursor:pointer;padding:6px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>'+
      '<div style="flex:1;overflow-y:auto">'+items+'</div>'+
      (cart.length?('<div style="display:flex;flex-direction:column;gap:10px;padding-top:14px;border-top:1px solid var(--border)"><a href="'+checkoutLink+'" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;justify-content:center;gap:9px;background:#0a90dd;color:#fff;font-size:16px;font-weight:600;padding:15px 22px;border-radius:980px">'+WA_ICON+' Finalizar pelo WhatsApp</a><button data-act="clearCart" style="border:none;background:none;color:var(--text-3);font-size:13px;cursor:pointer;padding:6px">Limpar carrinho</button></div>'):'')+
    '</div>';
}
function announce(msg){var el=document.getElementById('live-region');if(el){el.textContent='';setTimeout(function(){el.textContent=msg;},50);}}

function render(){
  var waGeneral=waLink(WA_DEFAULT,"Olá, LOA* Select! Quero saber mais sobre os produtos disponíveis.");
  var isDetail=state.hash.indexOf("p/")===0;
  var body=renderHeader(waGeneral,INSTA_DEFAULT)+(isDetail?renderDetail(WA_DEFAULT):renderHome(waGeneral))+renderFooter(waGeneral,INSTA_DEFAULT)+renderFloat(waGeneral);
  document.getElementById('app').innerHTML='<a href="#main" class="skip-link">Ir para o conteúdo</a><div class="page-shell '+(isDetail?'is-detail':'')+'" style="background:var(--page-bg);padding-top:96px">'+body+'</div>'+renderCartDrawer(WA_DEFAULT);
}

document.getElementById('app').addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var act=el.getAttribute('data-act'), val=el.getAttribute('data-val');
  if(act==='openProduct'){e.preventDefault();state.menuOpen=false;location.hash='p/'+val;}
  else if(act==='goHome'){e.preventDefault();state.menuOpen=false;if(location.hash)location.hash='';else render();}
  else if(act==='goCat'){e.preventDefault();state.menuOpen=false;if(location.hash){pendingCat=val;location.hash='';}else scrollCat(val);}
  else if(act==='goLoja'){e.preventDefault();state.menuOpen=false;if(location.hash){pendingCat='loja';location.hash='';}else scrollCat('loja');}
  else if(act==='toggleMenu'){state.menuOpen=!state.menuOpen;render();}
  else if(act==='toggleDark'){var htmlEl=document.documentElement;var d=htmlEl.classList.toggle('dark');try{localStorage.setItem(DARK_KEY,d?'1':'0');}catch(e){}render();}
  else if(act==='setImg'){state.galleryIndex=parseInt(val,10);render();}
  else if(act==='setSize'){state.sizeKey=val;state.galleryIndex=0;state.storageKey=null;render();}
  else if(act==='setColor'){state.colorIndex=parseInt(val,10);state.galleryIndex=0;render();announce('Cor selecionada');}
  else if(act==='setStorage'){state.storageKey=val;render();announce('Armazenamento '+val+' selecionado');}
  else if(act==='setMbSize'){state.mbSize=val;state.mbChip=null;state.memoryKey=null;state.storageKey=null;state.colorIndex=0;state.galleryIndex=0;render();}
  else if(act==='setMbChip'){state.mbChip=val;state.memoryKey=null;state.storageKey=null;state.colorIndex=0;state.galleryIndex=0;render();}
  else if(act==='setMemory'){state.memoryKey=val;render();announce('Memória '+val+' selecionada');}
  else if(act==='addToCart'){var ctx=computeDetailContext();cart.push({id:Date.now()+"-"+Math.random().toString(36).slice(2),productId:ctx.curP.id,name:ctx.effName,config:detailConfigLines(ctx),img:ctx.mainImg});saveCart();render();announce('Adicionado ao carrinho');}
  else if(act==='toggleCart'){state.cartOpen=!state.cartOpen;render();}
  else if(act==='removeCartItem'){cart=cart.filter(function(it){return it.id!==val;});saveCart();render();}
  else if(act==='clearCart'){cart=[];saveCart();render();}
  else if(act==='scrollRow'){var parts=val.split(':');scrollRow(parts[0],parseInt(parts[1],10));}
});

window.addEventListener('hashchange',function(){
  window.scrollTo(0,0);
  state.hash=location.hash.replace(/^#/,"");
  state.galleryIndex=0;state.sizeKey=null;state.colorIndex=0;state.storageKey=null;state.mbSize=null;state.mbChip=null;state.memoryKey=null;
  render();
  if(pendingCat){var id=pendingCat;pendingCat=null;setTimeout(function(){scrollCat(id);},60);}
});

render();

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&state.menuOpen){state.menuOpen=false;render();}
});
</script>
</body>
</html>
